<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待办清单</title>
  </head>
  <body class="min-h-screen bg-bg text-ink font-body">
    <main class="mx-auto max-w-2xl px-4 py-12">
      <header class="mb-8">
        <h1 class="text-4xl font-display font-semibold text-primary">待办清单</h1>
        <p class="mt-2 text-sm text-muted">记录并完成每一项任务</p>
      </header>

      <section class="bg-surface border border-line rounded-lg p-6">
        <div class="flex gap-3 mb-6">
          <input
            id="task-input"
            type="text"
            placeholder="输入新任务，按 Enter 或点击添加…"
            class="flex-1 rounded border border-line bg-bg px-4 py-2 text-ink placeholder:text-muted focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2"
          />
          <button
            id="add-button"
            class="rounded bg-primary px-6 py-2 text-primary-fg font-medium hover:opacity-90 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2 active:scale-95 transition"
          >
            添加
          </button>
        </div>

        <div id="empty-state" class="py-12 text-center text-muted hidden">
          <p class="text-lg">暂无任务</p>
          <p class="text-sm mt-1">在上方输入框添加第一项任务</p>
        </div>

        <ul id="task-list" class="space-y-2"></ul>

        <div id="task-container" class="hidden">
          <div class="mt-6 pt-6 border-t border-line">
            <div class="flex flex-wrap items-center justify-between gap-4">
              <div class="flex gap-2">
                <button
                  data-filter="all"
                  class="filter-btn rounded px-4 py-1.5 text-sm border border-line hover:bg-surface-alt focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2 transition"
                >
                  全部
                </button>
                <button
                  data-filter="active"
                  class="filter-btn rounded px-4 py-1.5 text-sm border border-line hover:bg-surface-alt focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2 transition"
                >
                  进行中
                </button>
                <button
                  data-filter="completed"
                  class="filter-btn rounded px-4 py-1.5 text-sm border border-line hover:bg-surface-alt focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2 transition"
                >
                  已完成
                </button>
              </div>

              <div class="flex gap-4 text-sm text-muted">
                <span>全部: <strong id="count-all" class="text-ink">0</strong></span>
                <span>进行中: <strong id="count-active" class="text-ink">0</strong></span>
                <span>已完成: <strong id="count-completed" class="text-ink">0</strong></span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
