<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨ 待办清单 ✨</title>
  </head>
  <body class="min-h-screen bg-bg text-ink font-body antialiased relative overflow-x-hidden">
    <!-- Decorative sparkles -->
    <div class="sparkle text-4xl" style="top: 10%; left: 10%; animation-delay: 0s;">✦</div>
    <div class="sparkle text-3xl" style="top: 20%; right: 15%; animation-delay: 0.5s;">✧</div>
    <div class="sparkle text-5xl" style="bottom: 15%; left: 20%; animation-delay: 1s;">✦</div>
    <div class="sparkle text-3xl" style="bottom: 25%; right: 10%; animation-delay: 1.5s;">✧</div>

    <main class="relative mx-auto max-w-2xl px-6 py-16 z-10">
      <header class="mb-12 text-center">
        <h1 class="text-5xl sm:text-6xl font-display font-bold text-primary drop-shadow-lg">
          ✨ 待办清单 ✨
        </h1>
        <p class="mt-4 text-lg text-muted font-medium">完成每一项任务，成为更好的自己！</p>
      </header>

      <section class="bg-surface/90 backdrop-blur-sm rounded-lg p-8 shadow-xl border-2 border-line card-hover">
        <div class="flex gap-3 mb-8">
          <input
            id="task-input"
            type="text"
            placeholder="输入新任务，按 Enter 添加~"
            class="flex-1 rounded-md border-2 border-primary/30 bg-surface-alt px-5 py-3 text-ink placeholder:text-muted/60 font-medium focus-visible:outline-none focus-visible:border-primary focus-visible:shadow-lg focus-visible:shadow-primary/20 transition-all"
          />
          <button
            id="add-button"
            class="rounded-md bg-gradient-to-r from-primary to-accent px-6 py-3 text-primary-fg font-bold shadow-lg hover:shadow-xl hover:shadow-primary/40 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2"
          >
            添加 ✨
          </button>
        </div>

        <div id="empty-state" class="py-16 text-center hidden">
          <p class="text-2xl text-muted">暂无任务 (´・ω・`)</p>
          <p class="text-sm text-muted/70 mt-2">快添加第一项任务吧~</p>
        </div>

        <ul id="task-list" class="space-y-3"></ul>

        <div id="task-container" class="hidden">
          <div class="mt-8 pt-6 border-t-2 border-line/50">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
              <div class="flex gap-2">
                <button
                  data-filter="all"
                  class="filter-btn rounded-full px-5 py-2 text-sm font-bold border-2 border-primary/30 hover:border-primary hover:bg-primary/10 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2 transition-all"
                >
                  全部
                </button>
                <button
                  data-filter="active"
                  class="filter-btn rounded-full px-5 py-2 text-sm font-bold border-2 border-primary/30 hover:border-primary hover:bg-primary/10 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2 transition-all"
                >
                  进行中
                </button>
                <button
                  data-filter="completed"
                  class="filter-btn rounded-full px-5 py-2 text-sm font-bold border-2 border-primary/30 hover:border-primary hover:bg-primary/10 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2 transition-all"
                >
                  已完成
                </button>
              </div>

              <div class="flex gap-4 text-sm font-bold">
                <span class="text-primary">全部: <strong id="count-all" class="text-accent">0</strong></span>
                <span class="text-primary">进行: <strong id="count-active" class="text-accent">0</strong></span>
                <span class="text-primary">完成: <strong id="count-completed" class="text-accent">0</strong></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <footer class="mt-12 text-center text-sm text-muted/60">
        <p>✨ 加油！每一天都是新的开始 ✨</p>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
