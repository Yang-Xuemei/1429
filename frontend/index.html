<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待办</title>
  </head>
  <body class="min-h-screen bg-bg text-ink font-body antialiased">
    <main class="mx-auto max-w-xl px-6 py-20 sm:py-28">
      <header class="mb-16">
        <h1 class="text-3xl sm:text-4xl font-display font-light tracking-tight text-ink">
          待办
        </h1>
        <div class="mt-3 h-px w-12 bg-primary/30"></div>
      </header>

      <section class="space-y-6">
        <div class="flex gap-3">
          <input
            id="task-input"
            type="text"
            placeholder="添加新任务…"
            class="flex-1 rounded-md border border-line bg-surface px-4 py-3 text-[15px] text-ink placeholder:text-muted/70 focus-visible:outline-none focus-visible:border-primary/40 transition-colors"
          />
          <button
            id="add-button"
            class="rounded-md bg-primary px-5 py-3 text-[15px] text-primary-fg font-medium hover:opacity-85 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2 active:scale-[0.98] transition"
          >
            添加
          </button>
        </div>

        <div id="empty-state" class="py-20 text-center hidden">
          <p class="text-sm text-muted tracking-wide">暂无任务</p>
        </div>

        <ul id="task-list" class="space-y-1"></ul>

        <div id="task-container" class="hidden">
          <div class="mt-10 pt-6 border-t border-line/70">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
              <div class="flex gap-1">
                <button
                  data-filter="all"
                  class="filter-btn rounded-md px-3.5 py-1.5 text-[13px] tracking-wide text-muted hover:text-ink hover:bg-surface-alt focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2 transition-colors"
                >
                  全部
                </button>
                <button
                  data-filter="active"
                  class="filter-btn rounded-md px-3.5 py-1.5 text-[13px] tracking-wide text-muted hover:text-ink hover:bg-surface-alt focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2 transition-colors"
                >
                  进行中
                </button>
                <button
                  data-filter="completed"
                  class="filter-btn rounded-md px-3.5 py-1.5 text-[13px] tracking-wide text-muted hover:text-ink hover:bg-surface-alt focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2 transition-colors"
                >
                  已完成
                </button>
              </div>

              <div class="flex gap-5 text-[12px] text-muted tracking-wider uppercase">
                <span>全部 <strong id="count-all" class="text-ink font-medium">0</strong></span>
                <span>进行 <strong id="count-active" class="text-ink font-medium">0</strong></span>
                <span>完成 <strong id="count-completed" class="text-ink font-medium">0</strong></span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
